<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KK 8 · seven-stanza engineering preview</title><style>*{box-sizing:border-box}body{font:15px system-ui;background:#f1f5f9;color:#182b44;margin:0}header{background:white;border-bottom:1px solid #ccd7e3;padding:12px 16px;position:sticky;top:0;z-index:2}h1{font-size:19px;margin:0 0 6px}.warn{color:#8b3c00;font-size:13px}nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}button,select{font:inherit;border:1px solid #9cacc1;border-radius:6px;background:#fff;padding:6px 10px}main{max-width:1150px;margin:auto;padding:12px}.panel{background:#fff;border:1px solid #cbd5e1;border-radius:10px;padding:10px;margin:8px 0}.score{overflow:auto}.sheet{width:878px;position:relative;transform-origin:top left}.sheet img{width:878px;display:block}.layer{position:absolute;inset:0;pointer-events:none}.band{position:absolute;left:160px;width:620px;height:32px;background:rgba(255,255,255,.96);border-top:1px dashed #abc;}.lyric{position:absolute;white-space:nowrap;font:600 14px Arial,sans-serif;color:#095bb5;transform:translateX(-50%)}.small{font-size:12px;color:#64748b}pre{white-space:pre-wrap;overflow-wrap:anywhere}#source{display:none}@media(max-width:700px){header{position:static}}</style></head><body><header><h1>KK 8 — seven-stanza notation layout preview</h1><div class="warn"><b>UNVERIFIED:</b> experimental word spacing and musical system boundaries. Do not use for singing or approval.</div><nav><button id="prev">←</button><select id="stanza"></select><button id="next">→</button><label>Zoom <select id="zoom"><option>50</option><option>75</option><option selected>100</option><option>125</option><option>150</option><option>200</option></select>%</label><label><input type="checkbox" id="overlay" checked> Show draft lyric overlay</label></nav></header><main><div class="panel score"><div class="sheet" id="sheet"><img src="../song-8/original.png" alt="Original KK 8 Malayalam notation"><div class="layer" id="layer"></div></div></div><div class="panel"><b>Exact source text</b><pre id="lyrics"></pre><div class="small" id="status"></div></div></main><script src="phrase-stretch.js"></script><script>
const verses=["Koodey paarkka neram vaikunnithaa\nKoorirulherunnu paarkka Devaa\nAashrayam verillaa neram thannil\nAashrithavathsalaa koodey paarkka","Aayussaam cherudinam odunnu\nBhoosanthoshamahima mangunnu\nChuttilum kaanhunnu maattam kèdum\nMaattamillaa Devaa koodey paarkka","Raajaraajanpol bhayankaranaay\nSaadhuvey darshichcheedaruthey nin\nChirakinkeezh soukhyavaramodey\nNanma daya nalki koodey paarkka","Èki kashtathayil sahathaapam\nApekshayil manassalivodey\nNissahaayarin sahaayakanaay\nVannu rakshichchu nee koodey paarkka","Sadaanin saannidhyam venham thaathaa\nPaathakanmel jayam ninkripayaal\nThunhacheivaan neeyallaathaarullhu\nSanthosha santhaapey koodey paarkka","Shathru bhayamilla neeyundenkil\nLokakannheer innilla kaipottum\nPaathaalhamey! Jayam evidey nin?\nMrithyumulh poy, jayam: koodey paarkka","Kannhadanjeedumbol nin krushiney\nKaanhikka mel lokamahimayum\nBhoomithyaa nizhal gamikkunnithaa\nBhaagyodayamaay nee koodey paarkka"];
const reference={width:878,height:1241,systems:[{y:371,x:[249,279,315,350,401,442,479,512,543,580,652,691,726]},{y:552,x:[223,259,298,331,367,401,443,486,529,573,641,705]},{y:731,x:[218,253,286,320,357,407,445,478,511,543,578,616,647,678,716]}]};
const $=id=>document.getElementById(id);let current=0;
for(let i=0;i<verses.length;i++){let o=document.createElement('option');o.value=i;o.textContent='Stanza '+(i+1)+' / 7';$('stanza').append(o)}
// Draft segmentation uses complete words. Boundaries are weighted by reference lyric fragment counts;
// these are hypotheses, not transcribed musical phrase divisions.
function segment(text){const words=text.match(/\S+|\s+/g)||[];const target=[13,12,15],total=40;let boundaries=[0];for(let i=1;i<3;i++){let ideal=words.length*target.slice(0,i).reduce((a,b)=>a+b,0)/total;let at=Math.round(ideal);boundaries.push(Math.max(boundaries[i-1]+1,Math.min(words.length-(3-i),at)))}boundaries.push(words.length);return [0,1,2].map(i=>words.slice(boundaries[i],boundaries[i+1]))}
function draw(){const text=verses[current],groups=segment(text),joined=groups.flat().join('');$('lyrics').textContent=text;$('layer').replaceChildren();$('stanza').value=current;$('prev').disabled=current===0;$('next').disabled=current===6;const show=$('overlay').checked;
if(show)groups.forEach((g,i)=>{const ref=reference.systems[i],band=document.createElement('div');band.className='band';band.style.top=(ref.y-19)+'px';$('layer').append(band);let proposal=SJMTCPhraseStretch.stretch(g,[ref.x[0],ref.x[ref.x.length-1]],{minGap:0});proposal.points.forEach(p=>{if(!p.text.trim())return;let el=document.createElement('span');el.className='lyric';el.textContent=p.text;el.style.left=p.x+'px';el.style.top=(ref.y-13)+'px';$('layer').append(el)})});
$('status').textContent='Text round-trip: '+(joined===text?'PASS':'FAIL')+' · musical alignment: NOT VERIFIED · system boundaries: ESTIMATED · collision checks: NOT VERIFIED';$('sheet').style.zoom=$('zoom').value+'%'}
$('prev').onclick=()=>{current=Math.max(0,current-1);draw()};$('next').onclick=()=>{current=Math.min(6,current+1);draw()};$('stanza').onchange=()=>{current=+$('stanza').value;draw()};$('zoom').onchange=draw;$('overlay').onchange=draw;window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='sjmtc-beta-set-stanza'){current=Math.max(0,Math.min(6,e.data.stanza-1));draw()}});draw();
</script></body></html>
