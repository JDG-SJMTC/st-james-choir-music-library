  if(!row.length||row[row.length-1].text!==kk8MasterSystemEnds[system-1])
   issues.push('Master system '+system+' endpoint changed');
 }
 // Do not certify other stanza boundaries without an independently verified
 // source-to-note mapping. Existing coordinates are provisional.
 return issues;
}
const kk8MasterIssues=qaMasterTemplate();
if(kk8MasterIssues.length)console.error('KK8 master template QA FAILED',kk8MasterIssues);

// Derive source lyric-line transitions from the exact Manglish text, without
// guessing musical note assignments or moving existing syllables.
function qaSourcePhraseMap(){
 const findings=[];
 const normalize=t=>t.replace(/\s/g,'');
 verses.forEach((verse,i)=>{
  const sourceLines=verse.split('\n').map(normalize);
  const parts=drafts[i];
  let cumulative=0;
  const ends=[];
  for(const line of sourceLines){cumulative+=line.length;ends.push(cumulative)}
  let position=0;
  const boundaries=[];
  for(let j=0;j<parts.length;j++){
   const previous=position;
   position+=normalize(parts[j].text).length;
   for(let k=0;k<ends.length-1;k++){
    if(previous<ends[k]&&position>=ends[k]){
     const exact=position===ends[k];
     boundaries.push({sourceLine:k+1,afterSyllable:j+1,system:parts[j].system,syllable:parts[j].text,exact});
     if(!exact)findings.push('Stanza '+(i+1)+' source line '+(k+1)+' ends INSIDE syllable '+parts[j].text+' (system '+parts[j].system+')');
    }
   }
  }
  if(boundaries.length!==3)findings.push('Stanza '+(i+1)+': expected 3 source lyric-line boundaries, got '+boundaries.length);
  console.info('KK8 source lyric boundaries stanza '+(i+1),boundaries);
 });
 return findings;
}
const kk8PhraseIssues=qaSourcePhraseMap();
if(kk8PhraseIssues.length)console.error('KK8 source lyric boundary QA FAILED',kk8PhraseIssues);

// Musical assignment gate: matching source text and avoiding overlaps do NOT
// certify note-to-syllable alignment. The only visually accepted region so far
// is stanza 1 system 2. All other regions remain provisional.
const kk8MusicalVerification={approved:[{stanza:1,system:2}],status:'incomplete'};
function qaMusicalAssignmentCoverage(){
 const approved=new Set(kk8MusicalVerification.approved.map(x=>x.stanza+':'+x.system));
 const pending=[];
 for(let stanza=1;stanza<=drafts.length;stanza++)
  for(let system=1;system<=3;system++)
   if(!approved.has(stanza+':'+system))
    pending.push('Stanza '+stanza+', system '+system+': note-to-syllable mapping not approved');
 return pending;
}
const kk8MusicalPending=qaMusicalAssignmentCoverage();
console.info('KK8 musical assignment QA: '+kk8MusicalPending.length+' systems pending independent verification',kk8MusicalPending);

// Structural correspondence check for KK8: stanza 1 and stanza 2 each
// have 10 source syllables per poetic line. Preserve those exact source
// phrase boundaries at indices 10,20,30; musical system breaks are 13,25.
// This is a structural check, NOT a claim of visually verified note mapping.
// Check all seven stanzas against the approved stanza-1 musical-slot template.
// Passing means consistent slot indexing and source-text integrity; it does NOT
// independently prove note-to-syllable musical correspondence or visual clarity.
function qaAllMasterSlotMappings(){
 const issues=[];
 const master=drafts[0];
 drafts.forEach((parts,i)=>{
  if(parts.length!==master.length)issues.push('Stanza '+(i+1)+': wrong slot count');
  parts.forEach((p,j)=>{
   if(!master[j]||p.system!==master[j].system||p.x!==master[j].x||p.y!==master[j].y)
    issues.push('Stanza '+(i+1)+' slot '+(j+1)+': differs from master');
  });
  const lines=verses[i].split('\n').map(x=>x.replace(/\s/g,''));
  for(let line=0;line<4;line++){
   if(parts.slice(line*10,(line+1)*10).map(p=>p.text).join('')!==lines[line])
    issues.push('Stanza '+(i+1)+' source lyric line '+(line+1)+' mismatch');
  }
 });
 return issues;
}
const kk8AllSlotIssues=qaAllMasterSlotMappings();
if(kk8AllSlotIssues.length)console.error('KK8 all-stanza master slot QA FAILED',kk8AllSlotIssues);
else console.info('KK8 all-stanza master slot and exact source line QA passed; musical/visual verification remains separate.');
function qaStanza2StructuralMapping(){
 const issues=[];
 const sourceLines=verses[1].split('\n').map(x=>x.replace(/\s/g,''));
 const parts=drafts[1];
 const boundaries=[10,20,30];
 let previous=0;
 for(let i=0;i<sourceLines.length;i++){
  const segment=parts.slice(previous,boundaries[i]||parts.length).map(p=>p.text).join('');
  if(segment!==sourceLines[i])issues.push('Stanza 2 source line '+(i+1)+' does not match mapped syllables');
  previous=boundaries[i]||parts.length;
 }
 const systemCounts=[1,2,3].map(k=>parts.filter(p=>p.system===k).length);
 if(systemCounts.join('/')!=='13/12/15')issues.push('Stanza 2 system slot counts differ from master');
 const master=drafts[0];
 for(let i=0;i<parts.length;i++){
  if(parts[i].system!==master[i].system||parts[i].x!==master[i].x)
   issues.push('Stanza 2 syllable '+(i+1)+' not on master slot');
 }
 return issues;
}
const kk8Stanza2StructuralIssues=qaStanza2StructuralMapping();
if(kk8Stanza2StructuralIssues.length)console.error('KK8 stanza 2 structural QA FAILED',kk8Stanza2StructuralIssues);
else console.info('KK8 stanza 2 structural QA passed: exact source lines and master slot indices. Musical alignment still requires visual approval.');
function qaSourceLineBoundaries(){
 // Verify each stanza uses the same three musical lines and ordered anchors.
 // A claim about a specific Malayalam word crossing a line is NOT established
 // by image-ink segmentation alone and must not be reported as a failure.
 const issues=[];
 drafts.forEach((parts,i)=>{
  for(let system=1;system<=3;system++){
   const row=parts.filter(p=>p.system===system);
   if(!row.length)issues.push('Stanza '+(i+1)+': missing system '+system);
   for(let j=1;j<row.length;j++)if(row[j].x<=row[j-1].x)
    issues.push('Stanza '+(i+1)+' system '+system+': non-increasing syllable anchors');
  }
 });
 return issues;
}

// Detect horizontal collisions using actual browser font measurements; report
// rather than moving syllables away from their measured Malayalam anchors.
// Phrase-boundary diagnostic for stanzas 5-7. The source Manglish
// line endings are the authoritative lyric boundaries (10/20/30/40).
// They are NOT equivalent to musical-system boundaries (13/25/40).
// Never reflow a phrase solely to force it onto a new staff system.
function qaPhraseBoundaries(){
 const issues=[];
 for(let stanza=4;stanza<=6;stanza++){
  const parts=drafts[stanza],lines=verses[stanza].split('\n').map(v=>v.replace(/\s/g,''));
  if(parts.length!==40){issues.push('Stanza '+(stanza+1)+': expected 40 source syllables');continue;}
  for(let line=0;line<4;line++){
   const group=parts.slice(line*10,(line+1)*10);
   if(group.map(p=>p.text).join('')!==lines[line])
    issues.push('Stanza '+(stanza+1)+' lyric line '+(line+1)+' source boundary mismatch');
  }
  for(const index of [10,20,30]){
   const left=parts[index-1],right=parts[index];
   if(!left||!right)issues.push('Stanza '+(stanza+1)+': missing phrase boundary '+index);
   else if(left.system!==drafts[0][index-1].system||right.system!==drafts[0][index].system)
    issues.push('Stanza '+(stanza+1)+': phrase boundary '+index+' shifted to wrong musical system');
  }
 }
 return issues;
}
const kk8PhraseIssues=qaPhraseBoundaries();
if(kk8PhraseIssues.length)console.error('KK8 source phrase QA FAILED',kk8PhraseIssues);
else console.info('KK8 stanza 5-7 source phrase boundaries preserved at positions 10/20/30; visual note mapping remains unverified.');
function qaVisibleStanza(){
 const issues=[];
 for(const row of $('score').querySelectorAll('[data-lyric-row]')){
  const boxes=[...row.querySelectorAll('text')].map(t=>({text:t.textContent,box:t.getBBox()}));
  // Test all pairs, not just neighbours: wide syllables can overlap multiple anchors.
  for(let i=0;i<boxes.length;i++)for(let j=i+1;j<boxes.length;j++){
   const a=boxes[i],b=boxes[j];
   const horizontal=a.box.x < b.box.x+b.box.width-1 && b.box.x < a.box.x+a.box.width-1;
   const vertical=a.box.y < b.box.y+b.box.height && b.box.y < a.box.y+a.box.height;
   if(horizontal&&vertical)issues.push('Row '+row.dataset.lyricRow+': '+a.text+' / '+b.text+' overlap');
  }
 }
 return issues;
}

// Readability audit: report cramped pairs without silently shifting Malayalam-aligned anchors.
function qaTightSyllableGaps(minGap=5){
 const warnings=[];
 for(const row of $('score').querySelectorAll('[data-lyric-row]')){
  const texts=[...row.querySelectorAll('text')].map(el=>({text:el.textContent,box:el.getBBox()})).sort((a,b)=>a.box.x-b.box.x);
  for(let i=1;i<texts.length;i++){
   const left=texts[i-1],right=texts[i],gap=right.box.x-(left.box.x+left.box.width);
   if(gap<minGap)warnings.push('Row '+row.dataset.lyricRow+': '+left.text+' / '+right.text+' gap '+gap.toFixed(1)+'px');
  }
 }
 return warnings;
}

const qaSliceErrors=qaSourceSlices();if(qaSliceErrors.length)console.error('KK8 score crop QA FAILED',qaSliceErrors);
const qaErrors=qaAllStanzas();if(qaErrors.length)console.error('KK8 lyric integrity QA FAILED',qaErrors);else console.info('KK8 lyric integrity QA passed for 7 stanzas');
// Explicit beta QA report: open song-8/index.html?qa=1 to test all seven
// stanza layouts with the browser's actual font metrics. This reports failures;
// it does not silently alter approved text or declare source-image QA passed.
// Stanza 1 is the line-span master. Other stanzas should occupy approximately
// the same horizontal span, independently for each of the three systems.
function qaLineSpanFit(tolerance=24){
 // Compare actual rendered glyph edges with the stanza-1 master line.
 const root=$('score'),original=current;
 const measure=()=>[1,2,3].map(system=>{
  const row=root.querySelector('[data-lyric-row="'+system+'"]');
  const boxes=[...row.querySelectorAll('text')].map(el=>el.getBBox());
  if(!boxes.length)return null;
  return {start:Math.min(...boxes.map(b=>b.x)),end:Math.max(...boxes.map(b=>b.x+b.width))};
 });
 const actual=measure();
 if(original!==0){current=0;render();}
 const master=measure();
 if(original!==0){current=original;render();}
 return actual.map((span,i)=>({system:i+1,master:master[i],actual:span,tolerance,
  pass:!!span&&!!master[i]&&Math.abs(span.start-master[i].start)<=tolerance&&Math.abs(span.end-master[i].end)<=tolerance}));
}

function runLayoutQa(){
 const original=current,results=[];
 for(let i=0;i<verses.length;i++){
  current=i;render();
  const collisions=qaVisibleStanza();
  const tightGaps=qaTightSyllableGaps();
  const lineSpanFit=qaLineSpanFit();
  const rows=[...$('score').querySelectorAll('[data-lyric-row]')];
  const outside=[];
  for(const row of rows){
   const n=Number(row.dataset.lyricRow)-1;
   const bandTop=cuts[n]+n*band,bandBottom=bandTop+band;
   for(const el of row.querySelectorAll('text')){
    const b=el.getBBox();
    if(b.x<0||b.x+b.width>878||b.y<bandTop||b.y+b.height>bandBottom)
      outside.push('Row '+(n+1)+': '+el.textContent+' extends outside lyric band');
   }
  }
  results.push({stanza:i+1,fragments:drafts[i].length,collisions,tightGaps,lineSpanFit,outside});
 }
 current=original;render();
 const structuralChecks={
  sourceCrop:qaSourceSlices(),
  lyricIntegrity:qaAllStanzas(),
  sourceLineBoundaries:qaSourceLineBoundaries(),
  phraseBoundariesStanzas5to7:qaPhraseBoundaries(),
  masterTemplate:qaMasterTemplate(),
  stanza2Structure:qaStanza2StructuralMapping()
 };
 const structuralFailures=Object.entries(structuralChecks).flatMap(([name,issues])=>issues.map(issue=>name+': '+issue));
 const failures=[...structuralFailures,...results.flatMap(r=>[...r.collisions,...r.tightGaps,...r.outside,...r.lineSpanFit.filter(x=>!x.pass).map(x=>'System '+x.system+' outside stanza 1 line span')].map(e=>'Stanza '+r.stanza+': '+e))];
 window.kk8QaReport={releaseStatus:'BLOCKED until all structural and visual checks pass',structuralChecks,sourceCropChecks:structuralChecks.sourceCrop,lyricIntegrityChecks:structuralChecks.lyricIntegrity,sourceLineBoundaryChecks:structuralChecks.sourceLineBoundaries,results,failures,visualSourceIntegrity:'NOT VERIFIED',malayalamGlyphAlignment:'NOT VERIFIED',malayalamDraftReadiness:qaMalayalamDrafts(),stanza1GroupCorrespondence:qaStanza1GroupCorrespondence(),stanza1SyllablePairs:qaStanza1SyllablePairs()};
 console.table(results.map(r=>({stanza:r.stanza,fragments:r.fragments,collisions:r.collisions.length,tightGaps:r.tightGaps.length,outside:r.outside.length})));
 if(failures.length)console.error('KK8 QA layout failures (including cramped syllable spacing)',failures);
 const output=$('qaOutput');if(output){output.textContent=JSON.stringify(window.kk8QaReport,null,2);output.hidden=false}
 return window.kk8QaReport;
}
// Pixel-level seam QA. Inspect the immutable source image at every cut;
// the system brace is deliberately excluded from the music-content region.
async function qaSourceSeams(){
 const img=new Image();img.src='original.png';await img.decode();
 const canvas=document.createElement('canvas');canvas.width=878;canvas.height=img.naturalHeight;
 const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0);
 const results=cuts.map(y=>{
  const counts=[];for(let dy=-2;dy<=2;dy++){const data=ctx.getImageData(150,y+dy,600,1).data;let ink=0;for(let i=0;i<data.length;i+=4)if((data[i]+data[i+1]+data[i+2])/3<180)ink++;counts.push(ink)}
  return {cut:y,sourceInkPixelsOnSeam:counts[2],nearbyRows:counts,pass:counts.every(n=>n===0)};
 });
 window.kk8SeamQa=results;
 if(results.some(r=>!r.pass))console.error('KK8 source seam QA FAILED',results);
 else console.info('KK8 source seam QA PASSED',results);
 return results;
}
function change(n){current=Math.max(0,Math.min(verses.length-1,n));render()}$('prev').onclick=()=>change(current-1);$('next').onclick=()=>change(current+1);$('stanza').onchange=()=>change(Number($('stanza').value));$('out').onclick=()=>{zoom=Math.max(25,zoom-25);render()};$('in').onclick=()=>{zoom=Math.min(300,zoom+25);render()};$('reset').onclick=()=>{zoom=100;render()};addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='sjmtc-beta-set-stanza')change(Number(e.data.stanza)-1)});render();if(new URLSearchParams(location.search).has('qa')){requestAnimationFrame(()=>runLayoutQa());qaSourceSeams().then(r=>{const out=$('qaOutput');if(out)out.textContent+='\n\nSource seam pixels:\n'+JSON.stringify(r,null,2)}).catch(console.error)}
</script></body></html>
