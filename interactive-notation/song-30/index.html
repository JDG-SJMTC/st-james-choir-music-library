     if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;
     place(el,drag.left+dx,drag.top+dy);});
   const end=e=>{if(!drag||e.pointerId!==drag.id)return;
     if(drag.moved){const x=el.offsetLeft,y=el.offsetTop;
       const snapX=x<24?6:x+el.offsetWidth>innerWidth-24?innerWidth-el.offsetWidth-6:x;
       place(el,snapX,y);save(kind,el)}drag=null;};
   grip.addEventListener('pointerup',end);grip.addEventListener('pointercancel',end);
   grip.addEventListener('dblclick',e=>{e.preventDefault();const p=defaults(kind,el);place(el,p.x,p.y);save(kind,el)});
   // Touch double-tap on grip resets just that toolbar.
   let last=0;grip.addEventListener('pointerup',e=>{if(e.pointerType!=='touch')return;const now=Date.now();if(now-last<340){const p=defaults(kind,el);place(el,p.x,p.y);save(kind,el)}last=now});
 }
 enable('top',top,topGrip);enable('side',zoom,sideGrip);
 addEventListener('resize',()=>{for(const [kind,el] of [['top',top],['side',zoom]]){place(el,el.offsetLeft,el.offsetTop);save(kind,el)}});
})();
