<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Choir View</title><link rel="stylesheet" href="choir.css"></head><body>
<header class="cv-header"><div><small>ST JAMES CHOIR VIEW</small><h1 id="title">Choir View</h1><p id="subtitle"></p></div><div class="cv-tools"><a href="index.html">Library</a><button id="full">Full screen</button></div></header>
<main class="cv-main"><section class="cv-notation"><div class="pane-label">STAFF NOTATION</div><div id="notationNav" class="notation-nav"></div><img id="notationImg" alt="Staff notation"></section>
<aside class="cv-lyrics"><nav class="language-nav"><a href="#malayalam">മലയാളം</a><a href="#manglish">Manglish</a></nav><section id="malayalam" class="language-section"><h2>മലയാളം</h2><p class="hint">Continuation lyrics from the staff-notation source</p><div id="malImages"></div></section><section id="manglish" class="language-section manglish"><h2>Manglish</h2><p class="hint">Transliterated lyrics</p><pre id="manglishText" class="manglish-text"></pre></section></aside></main>
<script src="data-embedded.js"></script><script src="choir-data.js"></script><script>
const id=new URLSearchParams(location.search).get('id')||'KK-0016'; const song=EMBEDDED_SONGS.find(x=>x.id===id); const d=CHOIR_DATA[id];
if(!song||!d){document.body.innerHTML='<p>Choir View data not found.</p>';} else {document.title=`Choir View · ${song.number}`; title.textContent=`${song.number}. ${song.english}`; subtitle.textContent=song.malayalam||'';
const img=document.getElementById('notationImg'), nav=document.getElementById('notationNav'); function show(i){img.src=d.notation[i].file;[...nav.children].forEach((b,j)=>b.classList.toggle('active',i===j));}
if(d.notation.length>1){d.notation.forEach((x,i)=>{const b=document.createElement('button'); b.textContent=(x.kind==='START'||x.kind==='AMBIGUOUS')?`Tune ${x.tune}`:`Page ${i+1}`; b.onclick=()=>show(i); nav.appendChild(b);});} show(0);
document.getElementById('malImages').innerHTML=d.malayalam.length?d.malayalam.map(f=>`<img class="mal-page" src="${f}" alt="Malayalam continuation">`).join(''):'<p class="hint">No separate continuation page detected; Malayalam stanza 1 is with the notation.</p>';
document.getElementById('manglishText').textContent=d.manglish; if(d.qaStatus!=='PASS'){const q=document.createElement('div');q.className='qa-note';q.textContent=`QA review flag: ${d.qaIssues.join(', ')} — visual check requested.`;document.querySelector('.cv-lyrics').prepend(q);}}
document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.();
</script></body></html>
